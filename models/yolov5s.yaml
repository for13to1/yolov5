# Parameters
nc: 80 # number of classes
# 检测类别数 (COCO 数据集 80 类)
depth_multiple: 0.33 # model depth multiple
# 模块深度缩放因子：实际模块数 = 配置值 × 0.33
width_multiple: 0.50 # layer channel multiple
# 通道宽度缩放因子：实际通道数 = 配置值 × 0.50
anchors:
  - [10, 13, 16, 30, 33, 23] # P3/8
  # 小目标锚框 (对应 80x80 特征图)
  - [30, 61, 62, 45, 59, 119] # P4/16
  # 中目标锚框 (对应 40x40 特征图)
  - [116, 90, 156, 198, 373, 326] # P5/32
  # 大目标锚框 (对应 20x20 特征图)

# YOLOv5 v6.0 backbone
backbone:
  # [from, number, module, args]
  # [输入来源索引, 重复次数, 模块类型, [参数列表]]
  [
    [-1, 1, Conv, [64, 6, 2, 2]], # 0-P1/2
    # -1: 上一层的输出
    # 1: 模块重复次数
    #! Conv, SPPF, Upsample 等单层模块不受 depth_multiple 影响
    # Conv: 卷积模块,
    # [64, 6, 2, 2]:
    ## 64: 基础输出通道数 (实际通道数 = 64 × width_multiple = 64 × 0.5 = 32)
    ## 6: 卷积核大小为 6x6
    ## 2: 步长 (stride=2，表示下采样 2 倍)
    ## 2: 填充 (padding=2，保持尺寸计算)
    # 层索引 0, /2: 相对于原始输入图像的下采样倍数为 2 (其中 P 表示 Pyramid level)
    [-1, 1, Conv, [128, 3, 2]], # 1-P2/4
    # [128, 3, 2]:
    ## 128: 基础输出通道数 (实际通道数 = 128 × width_multiple = 128 × 0.5 = 64)
    ## 3: 卷积核大小为 3x3
    ## 2: 步长 (stride=2，表示下采样 2 倍)
    ## padding 根据核尺寸自动计算 (通常 padding=kernel//2)
    # 层索引 1, /4: 相对于原始输入图像的下采样倍数为 4
    [-1, 3, C3, [128]], # 2
    # 3: 基础重复次数 (实际重复次数 = 3 × depth_multiple = 3 × 0.33 ≈ 1)
    #! C3, Bottleneck 等可堆叠模块受 depth_multiple 影响
    ## C3 内部结构固定 (1×1→3×3→1×1+残差), 卷积核默认为 3×3, 步长固定为 1 (不改变特征图尺寸), 无填充需求
    ## 128: 基础输出通道数 (实际通道数 = 128 × width_multiple = 128 × 0.5 = 64)
    [-1, 1, Conv, [256, 3, 2]], # 3-P3/8
    ## 256: 基础输出通道数 (实际通道数 = 256 × width_multiple = 256 × 0.5 = 128)
    # 下采样 8 倍 → P3 小目标检测层
    [-1, 6, C3, [256]], # 4
    # 6: 基础重复次数 (实际重复次数 = 6 × depth_multiple = 6 × 0.33 ≈ 2)
    ## 256: 基础输出通道数 (实际通道数 = 256 × width_multiple = 256 × 0.5 = 128)
    [-1, 1, Conv, [512, 3, 2]], # 5-P4/16
    ## 512: 基础输出通道数 (实际通道数 = 512 × width_multiple = 512 × 0.5 = 256)
    # 下采样 16 倍 → P4 中目标检测层
    [-1, 9, C3, [512]], # 6
    # 9: 基础重复次数 (实际重复次数 = 9 × depth_multiple = 9 × 0.33 ≈ 3)
    # 512: 基础输出通道数 (实际通道数 = 512 × width_multiple = 512 × 0.5 = 256)
    [-1, 1, Conv, [1024, 3, 2]], # 7-P5/32
    ## 1024: 基础输出通道数 (实际通道数 = 1024 × width_multiple = 1024 × 0.5 = 512)
    # 下采样 32 倍 → P5 大目标检测层
    [-1, 3, C3, [1024]], # 8
    # 3: 基础重复次数 (实际重复次数 = 3 × depth_multiple = 3 × 0.33 ≈ 1)
    # 1024: 基础输出通道数 (实际通道数 = 1024 × width_multiple = 1024 × 0.5 = 512)
    [-1, 1, SPPF, [1024, 5]], # 9
    # SPPF: Spatial Pyramid Pooling Fast
    ## 1024: 基础输出通道数 (实际通道数 = 1024 × width_multiple = 1024 × 0.5 = 512)
    ## 5: 池化核大小为 5x5
  ]

# YOLOv5 v6.0 head
head: [
    [-1, 1, Conv, [512, 1, 1]],
    ## 512: 基础输出通道数 (实际通道数 = 512 × width_multiple = 512 × 0.5 = 256)
    ## 1: 1x1卷积核
    ## 1: 步长 (stride=1, 保持特征图尺寸)
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    # nn.Upsample: 上采样层 (PyTorch 内置模块)
    ## None: 输出尺寸 (None 表示不指定具体尺寸，使用缩放因子)
    ## 2: 缩放因子为 2
    ## "nearest": 插值方法为最近邻插值
    [[-1, 6], 1, Concat, [1]], # cat backbone P4
    # [-1, 6]:
    ## -1: 上一层的输出
    ## 6: backbone 第 6 层输出 (P4/16)
    # 1: 重复次数为 1
    # Concat: 拼接模块 (PyTorch 内置模块)
    # [1]: 在通道维度 (dim=1) 上拼接
    [-1, 3, C3, [512, False]], # 13
    # -1: 上一层的输出
    # 3: 基础重复次数 (实际重复次数 = 3 × depth_multiple = 3 × 0.33 ≈ 1)
    ## 512: 基础输出通道数 (实际通道数 = 512 × width_multiple = 512 × 0.5 = 256)
    ## False: 禁用 shortcut 连接 (不使用残差连接)
    [-1, 1, Conv, [256, 1, 1]],
    ## 256: 基础输出通道数 (实际通道数 = 256 × width_multiple = 256 × 0.5 = 128)
    ## 1: 1x1 卷积核
    ## 1: 步长 (stride=1，保持特征图尺寸)
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 4], 1, Concat, [1]], # cat backbone P3
    # [-1, 4]:
    ## -1: 上一层的输出
    ## 4: backbone 第 4 层输出 (P3/8)
    # 1: 重复次数为 1
    # Concat: 拼接模块 (PyTorch 内置模块)
    # [1]: 在通道维度 (dim=1) 上拼接
    [-1, 3, C3, [256, False]], # 17 (P3/8-small)
    ## 256: 基础输出通道数 (实际通道数 = 256 × width_multiple = 256 × 0.5 = 128)

    [-1, 1, Conv, [256, 3, 2]],
    ## 256: 基础输出通道数 (实际通道数 = 256 × width_multiple = 256 × 0.5 = 128)
    ## 3: 3x3 卷积核
    ## 2: 步长 (stride=2，表示下采样 2 倍)
    [[-1, 14], 1, Concat, [1]], # cat head P4
    # [-1, 14]:
    ## -1: 上一层的输出
    ## 14: head 第 14 层输出 (P4/16)
    [-1, 3, C3, [512, False]], # 20 (P4/16-medium)
    # 3: 基础重复次数 (实际重复次数 = 3 × depth_multiple = 3 × 0.33 ≈ 1)
    ## 512: 基础输出通道数 (实际通道数 = 512 × width_multiple = 512 × 0.5 = 256)
    ## False: 禁用 shortcut 连接 (不使用残差连接)
    [-1, 1, Conv, [512, 3, 2]],
    ## 512: 基础输出通道数 (实际通道数 = 512 × width_multiple = 512 × 0.5 = 256)
    [[-1, 10], 1, Concat, [1]], # cat head P5
    ## 10: head 第 10 层输出 (P5/32)
    [-1, 3, C3, [1024, False]], # 23 (P5/32-large)
    ## 1024: 基础输出通道数 (实际通道数 = 1024 × width_multiple = 1024 × 0.5 = 512)

    [[17, 20, 23], 1, Detect, [nc, anchors]], # Detect(P3, P4, P5)
    # [17, 20, 23]:
    ## 17: P3/8 小目标检测层输出
    ## 20: P4/16 中目标检测层输出
    ## 23: P5/32 大目标检测层输出
    # 1: 重复次数为 1
    # Detect: 检测层 (自定义模块)
    # [nc, anchors]:
    ## nc: 检测类别数 (80 类)
    ## anchors: 锚框列表 (3 个尺度的锚框)
  ]
